name: Publish StormChase data

on:
  schedule:
    - cron: "*/5 * * * *"
    # These UTC schedules cover midnight in Europe/Berlin in CET and CEST.
    - cron: "0 23 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name != 'schedule' || (github.event.schedule != '0 23 * * *' && github.event.schedule != '0 22 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: stormchase-supabase-publisher
      cancel-in-progress: false
    steps:
      - name: Check out publisher
        uses: actions/checkout@v4

      - name: Check out StormChase source modules
        uses: actions/checkout@v4
        with:
          repository: alsohalteinbenutzername-source/stormchase
          ref: main
          path: stormchase-source
          token: ${{ secrets.STORMCHASE_SOURCE_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install publisher dependencies
        run: python -m pip install -r requirements.txt

      - name: Publish latest live data
        env:
          PYTHONPATH: ${{ github.workspace }}/stormchase-source
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python publisher.py --skip-daily-outlook

  publish-outlook:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && (github.event.schedule == '0 23 * * *' || github.event.schedule == '0 22 * * *'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: stormchase-daily-outlook
      cancel-in-progress: false
    steps:
      - name: Check out publisher
        uses: actions/checkout@v4

      - name: Check out StormChase source modules
        uses: actions/checkout@v4
        with:
          repository: alsohalteinbenutzername-source/stormchase
          ref: main
          path: stormchase-source
          token: ${{ secrets.STORMCHASE_SOURCE_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install publisher dependencies
        run: python -m pip install -r requirements.txt

      - name: Publish today's shared outlook
        env:
          PYTHONPATH: ${{ github.workspace }}/stormchase-source
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "$(TZ=Europe/Berlin date +%H)" != "00" ]; then
            echo "Skipping the UTC schedule because it is not midnight in Europe/Berlin."
            exit 0
          fi
          python publisher.py --daily-outlook-only
