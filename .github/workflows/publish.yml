name: Publish StormChase data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out publisher
        uses: actions/checkout@v4

      - name: Check out StormChase source modules
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.STORMCHASE_SOURCE_REPOSITORY }}
          path: stormchase-source
          token: ${{ secrets.STORMCHASE_SOURCE_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install publisher dependencies
        run: python -m pip install -r requirements.txt

      - name: Publish latest data
        env:
          PYTHONPATH: ${{ github.workspace }}/stormchase-source
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python publisher.py

    concurrency:
      group: stormchase-supabase-publisher
      cancel-in-progress: false
