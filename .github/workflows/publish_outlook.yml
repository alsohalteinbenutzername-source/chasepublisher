name: Publish StormChase daily outlook

on:
  schedule:
    # 23:07 UTC = 00:07 CET (avoids top-of-hour traffic spikes)
    - cron: "7 23 * * *"
    # 22:07 UTC = 00:07 CEST (avoids top-of-hour traffic spikes)
    - cron: "7 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out publisher
        uses: actions/checkout@v4

      - name: Check out StormChase source modules
        uses: actions/checkout@v4
        with:
          repository: alsohalteinbenutzername-source/stormchase
          ref: main
          path: stormchase-source
          token: ${{ secrets.STORMCHASE_SOURCE_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install publisher dependencies
        run: python -m pip install -r requirements.txt

      - name: Publish today's shared outlook
        env:
          PYTHONPATH: ${{ github.workspace }}/stormchase-source
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(TZ=Europe/Berlin date +%H)" != "00" ]; then
            echo "Skipping because it is not midnight in Europe/Berlin."
            exit 0
          fi
          python publisher.py --daily-outlook-only
